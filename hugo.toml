baseURL = 'https://jeremycardona.github.io/bridges/'
locale = 'en-us'
title = 'Bridges'
theme = 'PaperMod'
enableEmoji = true
enableRobotsTXT = true
mainSections = ['posts']

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params]
  description = 'mystical pixelscape wanderings'
  keywords = ['blog', 'technology', 'code', 'mystical', 'pixelscape']
  author = 'Jeremy Cardona'

  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  homeInfoParams = { Title = 'Bridges', Content = 'thoughts, code, and mystical pixelscape wanderings' }

  socialIcons = [
    { name = 'github', url = 'https://github.com/jeremycardona' }
  ]

  assets = { disableHLJS = true, disableFingerprinting = true }

  label = { icon = '', iconHeight = 0, text = 'Bridges' }

[languages]
  [languages.en]
    label = 'English'
    weight = 1

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 20
  [[menu.main]]
    identifier = 'series'
    name = 'Series'
    url = '/series/'
    weight = 25
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 30
